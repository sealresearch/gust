[package]
name = "sealpup"
version = "0.1.0"
edition = "2021"
description = "Install and run Seal's on-device models"
license = "MIT"
repository = "https://github.com/sealresearch/gust"
rust-version = "1.75"

[[bin]]
name = "sealpup"
path = "src/main.rs"

[dependencies]
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
