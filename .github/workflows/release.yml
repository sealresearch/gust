name: release

# Push a tag like v0.2.0. The release gets the Relay command line for every platform (what `sealpup install` downloads),
# the sealpup program for every platform, a SHA256SUMS file for all of them, and the Homebrew formula (sealpup.rb).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - run: ZIG=zig bash build.sh release lib-release
      - uses: actions/upload-artifact@v4
        with:
          name: runtime
          path: |
            out/release/relay-*
            out/release/gust-*

  cli:
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, name: sealpup-linux-x64 }
          - { os: ubuntu-22.04-arm, name: sealpup-linux-arm64 }
          - { os: macos-latest, name: sealpup-macos-x64, target: x86_64-apple-darwin }
          - { os: macos-latest, name: sealpup-macos-arm64 }
          - { os: windows-latest, name: sealpup-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --manifest-path cli/Cargo.toml ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Name the program for its platform
        run: |
          out=cli/target/release
          if [ -n "${{ matrix.target }}" ]; then out=cli/target/${{ matrix.target }}/release; fi
          if [ "${{ runner.os }}" = "Windows" ]; then src=$out/sealpup.exe; else src=$out/sealpup; fi
          mkdir -p dist
          cp "$src" "dist/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    needs: [runtime, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Homebrew formula, to copy into the sealresearch/homebrew-tap repository
        run: bash cli/scripts/formula.sh "$GITHUB_REF_NAME" dist/SHA256SUMS > dist/sealpup.rb
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
