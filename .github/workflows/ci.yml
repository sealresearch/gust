name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  runtime:
    # Windows, because the runtime tests are built as Windows programs and run here.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Build the Relay host, the WebAssembly host and the runtime tests
        run: ZIG=zig bash build.sh x64 wasm test-t5 test-temporal
      - name: Runtime tests
        run: |
          ./out/t5.exe
          ./out/temporal.exe

  platforms:
    # Every platform the sealpup command line downloads must still build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - run: ZIG=zig bash build.sh release

  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
