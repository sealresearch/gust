name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  runtime:
    # Windows, because the runtime tests are built as Windows programs and run here.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Build the Relay host, the WebAssembly host and the runtime tests
        run: ZIG=zig bash build.sh x64 wasm test-t5 test-temporal
      - name: Runtime tests
        run: |
          ./out/t5.exe
          ./out/temporal.exe

  platforms:
    # Every platform the sealpup command line downloads must still build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - run: ZIG=zig bash build.sh release
      - name: The model library and the Python wheels, for every platform
        run: |
          ZIG=zig bash build.sh lib
          python3 packages/python/scripts/build_wheels.py

  squint:
    # Squint, the QR reader, is C hosts plus a pipeline in C. The regression regenerates 2,154 frames and checks that the reader
    # returns, for every one, what the JavaScript release returned (tests/golden), bit for bit; then the same through the
    # model API and in WebAssembly.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Squint against the golden reads
        run: ZIG=zig bash models/squint/tests/run.sh
      - name: Squint through the shared library and the Python package
        run: |
          case "$RUNNER_OS" in
            Linux) target=lib-linux-x64; lib=out/lib/linux-x64/libgust.so ;;
            Windows) target=lib-windows-x64; lib=out/lib/windows-x64/gust.dll ;;
            macOS) target=lib-macos-arm64; lib=out/lib/macos-arm64/libgust.dylib ;;
          esac
          ZIG=zig bash build.sh $target
          root=$(pwd -W 2>/dev/null || pwd) # a Windows path for Python when this is Git Bash
          export GUST_LIB="$root/$lib" PYTHONPATH="$root/packages/python"
          for ref in out/squint-seq/*.ref.jsonl; do python models/squint/tools/python_run.py "${ref%.ref.jsonl}"; done
          node models/squint/tools/compare_api.mjs out/squint-seq py
      - name: Squint in WebAssembly through the JavaScript package
        run: |
          mkdir -p out/squint-wasm
          ZIG=zig WASM_OUT=out/squint-wasm bash build.sh wasm-models
          for ref in out/squint-seq/*.ref.jsonl; do node models/squint/tools/wasm_run.mjs "${ref%.ref.jsonl}"; done
          node models/squint/tools/compare_api.mjs out/squint-seq wasm

  sdk:
    # The model API and the Python package, on the three systems they run on: the library is built here, then the toy
    # models and Relay (downloaded from Hugging Face) go through the C and Python interfaces.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the library for this system (with the toy models, so the Python tests can try streams and audio)
        env:
          GUST_TOY: "1"
        run: |
          case "$RUNNER_OS" in
            Windows) target=lib-windows-x64; echo "LIB_PATH=out/lib/windows-x64/gust.dll" >> "$GITHUB_ENV" ;;
            macOS) target=lib-macos-arm64; echo "LIB_PATH=out/lib/macos-arm64/libgust.dylib" >> "$GITHUB_ENV" ;;
            *) target=lib-linux-x64; echo "LIB_PATH=out/lib/linux-x64/libgust.so" >> "$GITHUB_ENV" ;;
          esac
          ZIG=zig bash build.sh $target
      - name: The model API tests (toy models)
        if: runner.os == 'Windows'
        run: |
          ZIG=zig bash build.sh test-sdk-x64
          ./out/sdk-test-x64.exe
      - name: Fetch Relay from Hugging Face
        working-directory: packages/python
        run: |
          cp ../../cli/registry.json sealresearch/_registry.json
          PYTHONPATH=. python -c "import sealresearch as sr; sr.Model.load('relay-1', cache='../../relay-cache').close()"
      - name: The Python package tests
        working-directory: packages/python
        run: PYTHONPATH=. RELAY_MODEL_DIR="$GITHUB_WORKSPACE/relay-cache/relay-1" python -W error::ResourceWarning -m unittest discover -s tests -v
      - uses: dtolnay/rust-toolchain@stable
      - name: The command line with the library
        run: |
          here() { (cd "$1" && { pwd -W 2>/dev/null || pwd; }); }
          export SEALPUP_TEST_LIB="$(here "$(dirname "$LIB_PATH")")/$(basename "$LIB_PATH")"
          export SEALPUP_TEST_MODEL="$(here relay-cache/relay-1)"
          (cd cli && cargo test)
          (cd cli && cargo build --release)
          # end to end: install Relay (its program and weights from the real release and Hugging Face), then ask the same
          # requests through the program and through this library
          exe=cli/target/release/sealpup
          [ "$RUNNER_OS" = Windows ] && exe=$exe.exe
          export SEALPUP_HOME="$RUNNER_TEMP/sealpup-home"
          export SEALPUP_LIBRARY="$SEALPUP_TEST_LIB"
          $exe install relay-1
          python cli/scripts/compare_engines.py "$exe"
          $exe doctor

  js:
    # The JavaScript packages on the three systems: the model API is built as WebAssembly here, then the toy models and Relay
    # (downloaded from Hugging Face through the package itself) go through @sealresearch/gust and @sealresearch/relay.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the WebAssembly modules, and a copy with the toy models for the tests
        run: |
          mkdir -p out/toy
          ZIG=zig bash build.sh wasm-models wasm-models-mt
          GUST_TOY=1 WASM_OUT=out/toy ZIG=zig bash build.sh wasm-models wasm-models-mt
      - run: npm ci
      - run: npm run sync --workspaces
      - name: Fetch Relay from Hugging Face
        run: |
          node -e "import('./packages/js/src/index.mjs').then(async (m) => (await m.Model.load('relay-1', { cache: 'relay-cache' })).close())"
      - name: The tests
        env:
          RELAY_MODEL_DIR: ${{ github.workspace }}/relay-cache/relay-1
        run: npm test --workspaces

  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
